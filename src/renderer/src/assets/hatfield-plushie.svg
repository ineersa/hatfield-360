<svg xmlns="http://www.w3.org/2000/svg" width="256" height="320" viewBox="0 0 256 320" fill="none" role="img" aria-labelledby="title desc">
<title id="title">Hatfield plush puppy</title>
<desc id="desc">A tiny charcoal-grey plush puppy with an oversized head, large glossy amber eyes, short folded ears, little paws and a large embroidered H on its belly.</desc>
<defs>
 <radialGradient id="fur" cx=".38" cy=".25" r=".8"><stop stop-color="#91959B"/><stop offset=".6" stop-color="#62666E"/><stop offset="1" stop-color="#3C4048"/></radialGradient>
 <radialGradient id="cream" cx=".4" cy=".25" r=".8"><stop stop-color="#F2F2EF"/><stop offset=".7" stop-color="#D8DAD9"/><stop offset="1" stop-color="#A5AAA9"/></radialGradient>
 <radialGradient id="caramel" cx=".3" cy=".25" r=".9"><stop stop-color="#626771"/><stop offset=".65" stop-color="#363B44"/><stop offset="1" stop-color="#22262E"/></radialGradient>
 <radialGradient id="iris"><stop offset=".5" stop-color="#6F411D"/><stop offset=".78" stop-color="#C38928"/><stop offset=".92" stop-color="#EBC563"/><stop offset="1" stop-color="#7A4E20"/></radialGradient>
 <radialGradient id="eye" cx=".35" cy=".2" r=".85"><stop stop-color="#263341"/><stop offset=".45" stop-color="#0A1018"/><stop offset="1" stop-color="#030509"/></radialGradient>
 <linearGradient id="nose" x2="0" y2="1"><stop stop-color="#464A53"/><stop offset="1" stop-color="#151921"/></linearGradient>
 <filter id="soft"><feGaussianBlur stdDeviation=".6"/></filter>
</defs>
<!-- Small bean-filled body, tucked limbs, and broad soft feet. -->
<path d="M83 177C66 192 62 228 65 259C66 284 88 299 127 299C167 299 190 283 191 258C194 225 186 194 172 178Z" fill="url(#fur)"/>
