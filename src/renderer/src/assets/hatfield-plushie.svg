<g stroke="#252A32" stroke-width="3">
 <ellipse cx="80" cy="118" rx="32" ry="35" fill="url(#iris)"/>
 <ellipse cx="176" cy="118" rx="32" ry="35" fill="url(#iris)"/>
</g>
<ellipse cx="80" cy="118" rx="24" ry="27" fill="url(#eye)"/>
<ellipse cx="176" cy="118" rx="24" ry="27" fill="url(#eye)"/>
<g fill="#FFFDF6"><ellipse cx="71" cy="105" rx="7" ry="8" transform="rotate(30 71 105)"/><ellipse cx="167" cy="105" rx="7" ry="8" transform="rotate(30 167 105)"/><circle cx="89" cy="132" r="3" opacity=".7"/><circle cx="185" cy="132" r="3" opacity=".7"/></g>
<ellipse cx="128" cy="166" rx="41" ry="30" fill="url(#cream)"/>
<ellipse cx="128" cy="151" rx="25" ry="19" fill="url(#caramel)"/>
