<ellipse cx="81" cy="114" rx="43" ry="48" transform="rotate(-9 81 114)" fill="url(#cream)"/>
<ellipse cx="175" cy="114" rx="43" ry="48" transform="rotate(9 175 114)" fill="url(#caramel)"/>
<path d="M49 89Q75 65 100 84M156 80Q181 69 201 91" stroke="#E4E6E4" stroke-width="10" stroke-linecap="round"/>
