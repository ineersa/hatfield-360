<path d="M76 39C62 24 42 23 28 35C13 48 13 70 22 89C27 100 35 110 42 108C51 106 49 91 52 77C55 61 66 48 76 39Z" fill="url(#caramel)"/>
<path d="M180 39C194 24 214 23 228 35C243 48 243 70 234 89C229 100 221 110 214 108C205 106 207 91 204 77C201 61 190 48 180 39Z" fill="url(#caramel)"/>
<path d="M65 36C45 32 29 47 29 66M191 36C211 32 227 47 227 66" stroke="#848993" stroke-width="3" stroke-linecap="round" opacity=".55"/>
