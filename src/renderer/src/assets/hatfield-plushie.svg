<path d="M128 168V177M117 178Q122 182 128 177Q134 182 139 178" stroke="#4A505A" stroke-width="2.5" stroke-linecap="round"/>
<!-- Small embroidered initial: no oversized badge or toy-company branding. -->
<path d="M113 233V266M143 233V266M113 249.5H143" stroke="#56807A" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M112 234V265M142 234V265M114 248.5H142" stroke="#A7C0AE" stroke-width="1.3" stroke-linecap="round" stroke-dasharray="1.5 3.5"/>
<!-- Short tufts suggest brushed plush rather than a hard outline. -->
<g stroke="#BEC3CA" stroke-width="2" stroke-linecap="round" opacity=".45">
 <path d="M91 32L88 37M102 28L100 34M113 27L112 32M124 26V31M136 27L137 32M147 28L149 33M159 31L161 36M169 35L172 40M47 75L44 82M39 91L37 98M38 145L41 152M53 172L58 177M68 187L74 190M183 189L189 186M205 173L209 167M215 151L217 144M79 216L76 222M179 215L182 221M106 280L110 284M145 283L150 279"/>
