<ellipse cx="189" cy="244" rx="13" ry="16" transform="rotate(-18 189 244)" fill="url(#caramel)"/>
<ellipse cx="85" cy="287" rx="26" ry="21" transform="rotate(-14 85 287)" fill="url(#fur)"/>
<ellipse cx="171" cy="287" rx="26" ry="21" transform="rotate(14 171 287)" fill="url(#fur)"/>
<ellipse cx="85" cy="293" rx="20" ry="14" transform="rotate(-14 85 293)" fill="url(#caramel)"/>
<ellipse cx="171" cy="293" rx="20" ry="14" transform="rotate(14 171 293)" fill="url(#caramel)"/>
<path d="M128 23C140 18 144 24 153 23C163 22 170 28 178 31C187 33 192 42 199 47C208 54 211 64 216 73C223 85 224 101 224 115C225 134 220 155 210 170C199 186 183 195 166 199C145 206 112 207 91 201C69 195 51 184 42 167C32 149 30 132 31 115C30 99 33 83 40 70C44 61 49 52 57 46C63 39 71 34 80 31C89 26 98 24 107 25C116 20 121 24 128 23Z" fill="url(#fur)"/>
