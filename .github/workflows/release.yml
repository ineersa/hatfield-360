name: Release

# Runs only for a published GitHub release or a manual dispatch. Day-to-day validation is the local
# task hooks (`pnpm verify`), not PR CI.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to package
        required: true
        default: main

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || inputs.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm package

      - name: Locate packaged executable
        run: |
          case "$RUNNER_OS" in
            Linux) exe="release/linux-unpacked/hatfield-360" ;;
            macOS) exe="$(echo release/mac*/'Hatfield 360.app')/Contents/MacOS/Hatfield 360" ;;
            Windows) exe="release/win-unpacked/Hatfield 360.exe" ;;
          esac
          test -f "$exe"
          echo "E2E_EXECUTABLE=$PWD/$exe" >> "$GITHUB_ENV"

      - name: Smoke-test the packaged app
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a pnpm exec playwright test --config config/playwright.config.mts
          else
            pnpm exec playwright test --config config/playwright.config.mts
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: hatfield-360-${{ runner.os }}
          path: |
            release/*.AppImage
            release/*.dmg
            release/*.zip
            release/*.exe
          if-no-files-found: error

      - name: Attach installers to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          shopt -s nullglob
          gh release upload "$TAG" release/*.AppImage release/*.dmg release/*.zip release/*.exe --clobber

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-results-${{ runner.os }}
          path: test-results/
          if-no-files-found: ignore
