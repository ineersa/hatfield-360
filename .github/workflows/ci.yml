name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: E2E (Electron under xvfb)
        run: xvfb-run -a pnpm test:e2e
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results
          path: test-results/
          if-no-files-found: ignore
