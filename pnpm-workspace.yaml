# Wait 3 days before installing freshly published versions (supply-chain hygiene).
minimumReleaseAge: 4320
allowBuilds:
  # Native terminal backend: builds from source where no prebuild ships (Linux); N-API, so one build serves Node and Electron.
  node-pty: true
  # Squirrel.Windows installer support; the release uses NSIS, so its install script never needs to run.
  electron-winstaller: false
  # Its install script only prints a funding notice (pulled in by the bundled JSON/CSS/HTML language servers).
  core-js: false
