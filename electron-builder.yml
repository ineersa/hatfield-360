# Packaging config: `pnpm package` bundles with electron-vite, then electron-builder packages `out/` for the current OS.
appId: io.github.ineersa.hatfield360
productName: Hatfield 360
directories:
  output: release
files:
  - out/**
  - package.json
  # The main process loads it as the Linux window icon.
  - resources/icon.png
  # The workspace chat runs the user's own `claude` (CLAUDE_CODE_EXECUTABLE), so the Claude Agent SDK's
  # bundled Claude Code, a package per platform of a few hundred MB, is left out.
  - '!node_modules/@anthropic-ai/claude-agent-sdk-*/**'
# Executables run from real files, not from the asar: node-pty's native addon, spawn-helper (macOS),
# TypeScript's native language server and ripgrep. basedpyright changes its working directory to its own
# folder, which can't be inside an asar; it has no dependencies to take along.
asarUnpack:
  - node_modules/node-pty/**
  - node_modules/@typescript/**
  - node_modules/basedpyright/**
  # ripgrep, for Find in Files: its binary comes in a package per platform.
  - node_modules/@vscode/ripgrep*/**
# TypeScript's language server needs its lib/*.d.ts, which electron-builder leaves out by default.
onNodeModuleFile: ./config/electron-builder-node-modules.mjs
# node-pty is an N-API addon: its prebuilt (macOS) or install-time (Linux) binary already runs in Electron.
npmRebuild: false
# One 1024 px PNG; electron-builder derives the .icns from it.
icon: resources/icon.png
linux:
  target: AppImage
  executableName: hatfield-360
  # Docks match the running window (WM_CLASS / app_id) to the .desktop entry and its icon.
  syncDesktopName: true
  category: Development
mac:
  target: [dmg, zip]
  # Unsigned until a signing identity exists; Gatekeeper requires right-click → Open on first launch.
  identity: null
publish: null
