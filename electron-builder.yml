# Packaging config: `pnpm package` bundles with electron-vite, then electron-builder packages `out/` for the current OS.
appId: io.github.ineersa.hatfield360
productName: Hatfield 360
directories:
  output: release
files:
  - out/**
  - package.json
  # The main process loads it as the Linux window icon.
  - resources/icon.png
# node-pty's native addon, spawn-helper (macOS) and ConPTY agents (Windows) run from real files, not from the asar.
asarUnpack:
  - node_modules/node-pty/**
# node-pty is an N-API addon: its prebuilt (macOS, Windows) or install-time (Linux) binary already runs in Electron.
npmRebuild: false
# One 1024 px PNG; electron-builder derives the .icns / .ico from it.
icon: resources/icon.png
linux:
  target: AppImage
  executableName: hatfield-360
  # Docks match the running window (WM_CLASS / app_id) to the .desktop entry and its icon.
  syncDesktopName: true
  category: Development
mac:
  target: [dmg, zip]
  # Unsigned until a signing identity exists; Gatekeeper requires right-click → Open on first launch.
  identity: null
win:
  target: nsis
publish: null
